<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>FIELDPRO</title>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#172033;--m:#6b7588;--l:#e4e8f0;--a:#2563eb;--s:#eef2ff;color-scheme:light}

.bk{position:absolute;left:8px;border:0;background:none;font-size:30px;line-height:1;color:var(--a)}
main{padding:12px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0001}small,label{color:var(--m)}
h4{margin:16px 4px 6px;font-size:12px;letter-spacing:1.5px;color:var(--m);text-transform:uppercase}

nav button{flex:1;border:0;background:none;padding:8px 0 10px;color:var(--m);font-size:12px}nav i{display:block;font-style:normal;font-size:22px}nav .on{color:var(--a);font-weight:700}
nav .fab i{width:58px;height:58px;line-height:58px;margin:-26px auto 2px;border-radius:50%;background:var(--a);color:#fff;box-shadow:0 4px 12px #2563eb66}
.p{background:var(--a);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:15px}.p.w{background:#dc2626}.p.g{background:var(--s);color:var(--a)}.full{width:100%}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--l);border-radius:12px;background:var(--c);color:var(--t);box-sizing:border-box;max-width:100%}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}.row>*:first-child:is(input,select){flex:1;min-width:0}.row input[type=number]{width:84px}

.tl{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:18px 8px;text-align:center;box-shadow:0 1px 3px #0001}.tl i{font-style:normal;font-size:26px;display:block;margin-bottom:6px}.tl b{display:block}.tl small{font-size:12px}
.st{background:var(--c);border:1px solid var(--l);border-radius:16px;text-align:center;padding:14px 4px}.st b{font-size:28px;display:block}
.sum{display:flex;justify-content:space-around;background:var(--s);padding:12px;margin:-12px -12px 10px;text-align:center}.sum b{font-size:22px;display:block}
.tb{display:flex;border-bottom:1px solid var(--l);margin:0 -12px 10px}.tb button{flex:1;background:none;border:0;padding:12px 0;font-weight:600;color:var(--m);border-bottom:3px solid transparent}.tb .on{color:var(--a);border-color:var(--a)}
.sr{display:flex;gap:10px;align-items:center;background:var(--c);border:1px solid var(--l);border-radius:18px;padding:12px;margin:8px 0}.sr .bd{min-width:44px;height:44px;border-radius:12px;background:var(--s);color:var(--a);font-weight:700;display:flex;align-items:center;justify-content:center}.sr .in{flex:1;min-width:0}
.ch{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--s);color:var(--a);margin-left:4px}.ch.w{background:#dcfce7;color:#15803d}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--l);background:var(--c);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.add{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--a);color:#fff;border:0;font-size:30px;box-shadow:0 4px 12px #2563eb66;z-index:4}
.pr{height:10px;background:var(--l);border-radius:9px;overflow:hidden}.pr div{height:100%;background:linear-gradient(90deg,#22c55e,#2563eb)}
.dn{width:150px;height:150px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center}.dn div{width:108px;height:108px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.av{width:56px;height:56px;border-radius:50%;background:var(--a);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
table{border-collapse:collapse;font-size:12px;background:var(--c)}td,th{border:1px solid var(--l);padding:4px 6px;white-space:nowrap}th{background:#1e293b;color:#fff}.sc{overflow-x:auto}
.hd{background:#1e293b;color:#fff;border-radius:18px;padding:14px}.hd h2{margin:0}.hd small{color:#cbd5e1}.k{border-radius:16px;padding:10px}.k b{font-size:26px;display:block;color:#172033}.k1{background:#e8effd}.k2{background:#e5f5ee}.k3{background:#fff1e1}
.ln{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--l)}.ln:last-child{border:0}.ln i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:12px;background:var(--s);display:flex;align-items:center;justify-content:center}
.sp{white-space:nowrap}.sp output{display:inline-block;min-width:34px;text-align:center;font-weight:700;font-size:18px}.sp button{padding:6px 14px;font-size:18px}@media print{nav,header,.np,.add{display:none}body{padding:0;background:#fff}}
</style></head><body><header id=hd></header><main id=app></main><nav id=nv></nav>
<script>
const K='fieldpro_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),r2=x=>Math.round(x*100)/100;
const pk=()=>new Date(Date.now()+5*36e5).toISOString().slice(0,10);
const S=(id,brand,name,bpc)=>({id,brand,name,bpc,rate:0});
const seed=()=>({sel:{did:'d1',date:pk()},dists:[{id:'d1',name:'Distributor 1',zone:'Faisalabad',station:'Jhang',area:'Chiniot Road Retail',so:'Hammad Asif',dsf:'',inv:0}],outlets:[],bk:[],open:{},rc:{},
skus:[S('sh','Hockey','Super Hockey',9),S('ch','Hockey','Classic Hockey',9),S('ph','Hockey','Prime Hockey',9),S('o60','Oll','60gm',48),S('o90','Oll','90gm',48),S('o155','Oll','155gm',48),S('o255','Oll','255gm',48),S('o290','Oll','290gm',48),S('o20','Oll','20ml',48),S('o275','Oll','275ml',24),S('o475','Oll','475ml',12)]});
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Storage full - take a backup')}};
try{navigator.storage?.persist?.()}catch(e){}
let v='home',ed=null,eo=null,f='all',q='',iv=null,iback='ops';
const D=()=>db.dists.find(d=>d.id==db.sel.did)||db.dists[0],sk=id=>db.skus.find(s=>s.id==id);
const ctn=l=>{const s=sk(l.sid);return s?(l.u=='box'?l.q/s.bpc:+l.q):0};
const dayOf=(date,did)=>db.bk.filter(b=>b.date==date&&b.did==did).sort((a,b)=>a.seq-b.seq),day=()=>dayOf(db.sel.date,D().id);
const cs=b=>r2(b.lines.reduce((a,l)=>a+ctn(l),0));
const amt=b=>{let g=0,n=0;['Hockey','Oll'].forEach(br=>{const x=b.lines.reduce((a,l)=>{const s=sk(l.sid);return s&&s.brand==br?a+ctn(l)*(b.rates?.[l.sid]??s.rate):a},0);g+=x;n+=x*(1-(b.disc?.[br]||0)/100)});return{g,n}};
const st=bs=>{const t={},br={Hockey:0,Oll:0},pr={Hockey:0,Oll:0};let n=0,lc=0;bs.forEach(b=>{const seen={};b.lines.forEach(l=>{const s=sk(l.sid);if(!s)return;const c=ctn(l);t[l.sid]=(t[l.sid]||0)+c;br[s.brand]+=c;seen[s.brand]=1;lc++});Object.keys(seen).forEach(k=>pr[k]++);n+=amt(b).n});return{t,br,pr,n,lc,v:bs.length,p:bs.filter(b=>b.lines.length).length}};
const up=(o,k,x)=>{o[k]=x;save()},op=(k,i,x)=>{(db.open[k]=db.open[k]||{})[i]=x===''?undefined:+x;save();render()};
const ph=o=>o.phone||(String(o.addr).match(/0\d{9,11}/)||[''])[0];
const ago=id=>{const d=db.bk.filter(b=>b.oid==id&&b.date<db.sel.date).map(b=>b.date).sort().pop();return d?Math.round((new Date(db.sel.date)-new Date(d))/864e5)+' days ago':'Never'};
const go=x=>{v=x;ed=null;eo=null;scrollTo(0,0);render()};
const dbar=()=>`<div class="row np"><input type=date value=${db.sel.date} onchange="db.sel.date=this.value;save();render()">${db.dists.length>1?`<select onchange="db.sel.did=this.value;save();render()">${db.dists.map(d=>`<option value=${d.id} ${d.id==D().id?'selected':''}>${esc(d.zone)} › ${esc(d.station)} › ${esc(d.name)}`).join('')}</select>`:''}</div>`;
const V={},TT={home:'FIELDPRO',ops:'Operations',visit:'Visit Plan',geo:'Geo Tagging',more:'More',orders:'Orders',reps:'Reports',inv:'Invoice',dsr:'DSR Report',rep:'Daily Sales Report',prod:'Products',set:'Settings',bak:'Backup & Restore',add:'Add Store',edit:'Edit Store'},MAIN=['home','ops','visit','geo','more'],PAR={reps:'ops',orders:'ops',dsr:'ops',rep:'ops',prod:'ops',add:'geo',edit:'geo',set:'more',bak:'more'};
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
V.home=()=>{const d=D(),s=st(day()),m=db.bk.filter(b=>b.did==d.id&&b.date.slice(0,7)==db.sel.date.slice(0,7)),ms=m.length?Math.round(m.filter(b=>b.lines.length).length/m.length*100):0,pc=s.v?Math.round(s.p/s.v*100):0,ini=(d.so||'FP').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const t=(n,l,c)=>`<div class=st><b style="color:${c}">${n}</b><small>${l}</small></div>`;
return `<div class=card><div class=row style=justify-content:flex-start><div class=av>${ini}</div><div><b>${esc(d.so)} (SO)${d.dsf?', '+esc(d.dsf)+' (DSF)':''}</b><br><small>${esc(d.station)} · ${esc(d.zone)} · ${esc(d.area)}</small></div></div><div class=pr><div style=width:${ms}%></div></div><div class=row><small>Monthly score</small><small>${ms}%</small></div></div>
<h4>Today · ${fd(db.sel.date)}</h4><div class=g3>${t(s.v,'Total Calls','#2563eb')}${t(s.p,'Productive','#16a34a')}${t(s.v-s.p,'Un Productive','#f59e0b')}${t(s.p?r2(s.lc/s.p):'0.0','SKU / Call','#8b5cf6')}${t(r2(s.br.Hockey+s.br.Oll),'Cartons','#2563eb')}${t(pc+'%','Productivity','#16a34a')}</div>
<h4>Visit Productivity</h4><div class=card><div class=dn style="background:conic-gradient(#16a34a ${pc}%,#e4e8f0 0)"><div>${s.p}/${s.v}</div></div><center><small>Productive calls out of total visits</small></center></div>${mtd()}<button class="p full" onclick="go('visit')">Start Visit Plan</button>`};
V.ops=()=>{const t=(i,n,s,g)=>`<div class=tl onclick="go('${g}')"><i>${i}</i><b>${n}</b><small>${s}</small></div>`;return `<div class=gr>${t('📋','Book Order',day().length+' visits today','visit')}${t('🧾','Orders','Day wise','orders')}${t('📈','DSR Report','Print / PDF','dsr')}${t('📊','Daily Report','Sales & order','rep')}${t('🗂️','Reports','All reports & invoices','reps')}${t('📦','Products',db.skus.length+' active','prod')}${t('📍','Stores',db.outlets.length+' stores','geo')}${t('➕','Add Store','New outlet','add')}</div>`};
V.visit=()=>{if(ed)return entry(db.outlets.find(o=>o.id==ed));const bs=day(),s=st(bs),tm=q.toLowerCase();
let rows=bs.map(b=>({o:db.outlets.find(o=>o.id==b.oid)||{id:b.oid,name:b.on,type:b.ot,addr:b.oa},b,n:b.seq}));
db.outlets.filter(o=>o.did==D().id&&!bs.some(b=>b.oid==o.id)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(o=>rows.push({o,n:(o.name[0]||'?').toUpperCase()}));
const all=rows.length;rows=rows.filter(r=>(f=='all'||(f=='p'&&r.b&&!r.b.np)||(f=='n'&&r.b&&r.b.np))&&r.o.name.toLowerCase().includes(tm));
return `<div class=sum><div><small>Productive Calls</small><b>${s.p} / ${s.v}</b></div><div><small>Non Productive</small><b>${s.v-s.p}</b></div><div><small>Cartons</small><b>${r2(s.br.Hockey+s.br.Oll)}</b></div></div>
<div class=tb>${[['all','All ('+all+')'],['p','Productive ('+s.p+')'],['n','Non-Prod ('+(s.v-s.p)+')']].map(x=>`<button class="${f==x[0]?'on':''}" onclick="f='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
<div class=row><input placeholder="Search store" value="${esc(q)}" onchange="q=this.value;render()"></div>${dbar()}`+(rows.map(r=>{const o=r.o,b=r.b,p=ph(o);return `<div class=sr onclick="ed='${o.id}';render()"><div class=bd>${r.n}</div><div class=in><b>${esc(o.name)}</b><span class="ch ${o.type=='W'?'w':''}">${o.type=='W'?'W.S':'R'}</span><br><small>${esc(o.addr)}</small><br><small>${b?(b.np?'Non productive'+(b.remark?': '+esc(b.remark):''):b.inv+' · '+cs(b)+' ctn · Rs '+Math.round(amt(b).n)):'Last visit: '+ago(o.id)}</small></div>${o.lat?`<a class=ib href="https://maps.google.com/?q=${o.lat},${o.lng}" target=_blank onclick=event.stopPropagation()>📍</a>`:''}${p?`<a class=ib href="tel:${p}" onclick=event.stopPropagation()>📞</a>`:''}</div>`}).join('')||'<small>No stores. Use + to add.</small>')+`<button class=add onclick="go('add')">+</button>`};
function entry(o){const b=day().find(x=>x.oid==o.id)||{lines:[],disc:{},remark:''},qy=id=>b.lines.find(l=>l.sid==id)||{};
return `<h3 style=margin:4px>${esc(o.name)}</h3><small>${o.type=='W'?'Wholesale':'Retail'} · ${esc(o.addr)}</small>`+['Hockey','Oll'].map(br=>`<div class=card><b>${br=='Oll'?'Oll Clean':'Hockey Matches'}</b>`+db.skus.filter(s=>s.brand==br&&(!s.off||qy(s.id).q)).map(s=>`<div class=row><span>${esc(s.name)}</span><span class=sp><button class=p onclick="stp('${s.id}',-1)">−</button><output id=q_${s.id}>${qy(s.id).q||0}</output><button class=p onclick="stp('${s.id}',1)">+</button> <select id=u_${s.id}><option value=ctn>ctn<option value=box ${qy(s.id).u=='box'?'selected':''}>box/pc</select></span></div>`).join('')+`<div class=row><span>Brand discount %</span><input type=number step=any id=d_${br} value="${b.disc?.[br]??''}"></div></div>`).join('')+`<input id=rm placeholder="Remarks" style=width:100%;margin-bottom:8px value="${esc(b.remark)}"><div class=gr><button class=p onclick="sv('${o.id}')">Save order</button><button class="p w" onclick="sv('${o.id}',1)">Non productive</button></div>`}
function sv(oid,np){const o=db.outlets.find(x=>x.id==oid),d=D(),lines=[];if(!np)db.skus.forEach(s=>{const x=+($('#q_'+s.id)?.value||0);if(x>0)lines.push({sid:s.id,q:x,u:$('#u_'+s.id).value})});
let b=day().find(x=>x.oid==oid);if(!b){b={id:uid(),date:db.sel.date,did:d.id,oid,seq:Math.max(0,...day().map(x=>x.seq))+1};db.bk.push(b)}
Object.assign(b,{lines,np:!lines.length,remark:$('#rm').value,on:o.name,ot:o.type,oa:o.addr,disc:{Hockey:+$('#d_Hockey').value||0,Oll:+$('#d_Oll').value||0},rates:Object.fromEntries(db.skus.map(s=>[s.id,s.rate]))});
if(lines.length&&!b.inv)b.inv='INV-'+String(++d.inv).padStart(4,'0');ed=null;save();if(lines.length){iv=b.id;iback='visit';go('inv')}else render()}
V.orders=()=>dbar()+(day().map(b=>`<div class=sr onclick="${b.np?`ed='${b.oid}';v='visit';render()`:`iv='${b.id}';iback='orders';go('inv')`}"><div class=bd>${b.seq}</div><div class=in><b>${esc(b.on)}</b><br><small>${b.np?'Non productive':b.inv+' · '+cs(b)+' ctn'}</small></div><b>${b.np?'':'Rs '+Math.round(amt(b).n)}</b></div>`).join('')||'<small>No visits on this date.</small>');
V.geo=()=>{const tm=q.toLowerCase(),os=db.outlets.filter(o=>o.name.toLowerCase().includes(tm));return `<div class=row><input placeholder="Search store" value="${esc(q)}" onchange="q=this.value;render()"></div>`+os.map(o=>`<div class=sr><div class=in><b>${esc(o.name)}</b><br><small>${esc(o.addr)}</small><br><small>${o.lat?'GPS: '+o.lat+', '+o.lng:'Not tagged'}</small></div><button class="p g" onclick="tag('${o.id}')">◎ ${o.lat?'Update':'Tag'}</button><button class="ib" onclick="eo='${o.id}';go('edit');eo='${o.id}';render()">✏️</button></div>`).join('')+`<button class=add onclick="go('add')">+</button>`};
function tag(id){navigator.geolocation.getCurrentPosition(p=>{const o=db.outlets.find(x=>x.id==id);o.lat=+p.coords.latitude.toFixed(5);o.lng=+p.coords.longitude.toFixed(5);save();render()},()=>alert('Allow GPS permission and try again'),{enableHighAccuracy:true,timeout:15000})}
V.add=()=>`<div class=card><b>New store</b> <small>→ ${esc(D().station)} · ${esc(D().name)}</small><div class=row><input id=n placeholder="Store name"><select id=t><option value=R>Retail<option value=W>Wholesale</select></div><div class=row><input id=a placeholder="Address / road"></div><div class=row><input id=p type=tel placeholder="Phone"></div><button class="p full" onclick="addo()">Save store</button></div><div class=card><b>Bulk add</b><br><small>One per line: Name | R or W | Address / Phone</small><textarea id=bulk rows=5 style=width:100%></textarea><button class="p full" onclick="bulk()">Add all</button></div>`;
function addo(){if(!$('#n').value.trim())return;db.outlets.push({id:uid(),did:D().id,name:$('#n').value.trim(),type:$('#t').value,addr:$('#a').value,phone:$('#p').value});save();go('geo')}
function bulk(){$('#bulk').value.split('\n').forEach(l=>{const p=l.split('|').map(x=>x.trim());if(p[0])db.outlets.push({id:uid(),did:D().id,name:p[0],type:/^w/i.test(p[1]||'')?'W':'R',addr:p[2]||''})});save();go('geo')}
V.edit=()=>{const o=db.outlets.find(x=>x.id==eo);if(!o)return'';const i=(k,t)=>`<div class=row><label>${t}</label><input value="${esc(o[k])}" onchange="up(db.outlets.find(x=>x.id=='${o.id}'),'${k}',this.value)"></div>`;
return `<div class=card>${i('name','Name')}${i('addr','Address')}${i('phone','Phone')}<div class=row><label>Type</label><select onchange="up(db.outlets.find(x=>x.id=='${o.id}'),'type',this.value)"><option value=R>Retail<option value=W ${o.type=='W'?'selected':''}>Wholesale</select></div><div class=row><label>Distributor</label><select onchange="up(db.outlets.find(x=>x.id=='${o.id}'),'did',this.value)">${db.dists.map(d=>`<option value=${d.id} ${d.id==o.did?'selected':''}>${esc(d.name)}`).join('')}</select></div><small>Moving a store keeps old bookings with their original distributor.</small><br><button class="p w" onclick="if(confirm('Delete store? Past bookings stay.')){db.outlets=db.outlets.filter(x=>x.id!='${o.id}');save();go('geo')}">Delete store</button></div>`};
V.prod=()=>`<div class=card><small>Per-carton count (boxes/pcs) and carton rate in Rs. Old invoices keep their original rates.</small>`+db.skus.map((s,i)=>`<div class=row><span>${esc(s.name)}</span><span><input type=number value=${s.bpc} onchange="up(db.skus[${i}],'bpc',+this.value)"> <input type=number value=${s.rate} onchange="up(db.skus[${i}],'rate',+this.value)"></span></div>`).join('')+`</div>`;
V.set=()=>{const d=D(),i=(k,t)=>`<div class=row><label>${t}</label><input value="${esc(d[k])}" onchange="up(D(),'${k}',this.value)"></div>`;

$('#hd').innerHTML=(m&&!ed?'':`<button class=bk onclick="${ed?`ed=null;render()`:`go('${(v=='inv'?iback:PAR[v])||'ops'}')`}">‹</button>`)+(ed?'Book Order':TT[v])+(sub&&!ed?`<small>${sub}</small>`:'');
$('#app').innerHTML=(V[v]||V.home)();
const N=[['home','🏠','Home'],['ops','▦','Operations'],['visit','📋','Visit Plan'],['geo','◎','Geo Tagging'],['more','⋯','More']];
$('#nv').innerHTML=N.map(n=>`<button class="${n[0]==v||(PAR[v]==n[0]&&0)?'on':''} ${n[0]=='visit'?'fab':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('')}
render();try{navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
